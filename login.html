<!DOCTYPE html>
<html>
<head>

<title>Login</title>
<link rel="stylesheet" href="css/style.css">

<style>

.auth-box{
max-width:400px;
margin:80px auto;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.auth-box h2{
text-align:center;
margin-bottom:20px;
}

.auth-box input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ddd;
}

.login-btn{
background:#ff5a00;
color:white;
border:none;
padding:12px;
width:100%;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<div id="navbar"></div>

<div class="auth-box">

<h2>Login</h2>

<form>

<input placeholder="Email">

<input type="password" placeholder="Password">

<button class="login-btn">Login</button>

</form>

<p style="text-align:center;margin-top:10px">
Don't have account? <a href="register.html">Register</a>
</p>

</div>

<div id="footer"></div>

<script src="js/main.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PizzaHub - Cart</title>

<style>

body{
font-family: Arial;
background:#0b1a2d;
color:white;
margin:0;
padding:0;
}

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:black;
}

.logo{
color:orange;
font-size:22px;
font-weight:bold;
}

.nav-links a{
color:white;
text-decoration:none;
margin-left:20px;
}

.container{
width:80%;
margin:auto;
margin-top:40px;
}

.cart-item{
display:flex;
align-items:center;
background:#132a45;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

.cart-item img{
border-radius:8px;
}

.cart-info{
margin-left:20px;
}

.cart-info button{
margin-top:10px;
background:red;
color:white;
border:none;
padding:6px 10px;
border-radius:5px;
cursor:pointer;
}

#cartTotal{
margin-top:30px;
font-size:22px;
}

#payBtn{
margin-top:20px;
padding:12px 25px;
font-size:18px;
background:orange;
border:none;
border-radius:8px;
cursor:pointer;
}

#payBtn:hover{
background:#ff9f1c;
}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

<div class="logo">🍕 PizzaHub</div>

<div class="nav-links">
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="cart.html">Cart</a>
<a href="orders.html">Orders</a>
</div>

</div>


<!-- CART SECTION -->

<div class="container">

<h1>Your Cart</h1>

<div id="cartItems"></div>

<h2 id="cartTotal"></h2>

<button id="payBtn" onclick="goToPayment()">Pay Now</button>

</div>


<!-- CART SCRIPT -->

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || []

let container = document.getElementById("cartItems")

let total = 0

container.innerHTML = ""

if(cart.length === 0){

container.innerHTML = "<h3>Your cart is empty</h3>"

}

cart.forEach((item,index) => {

let card = document.createElement("div")

card.className = "cart-item"

card.innerHTML = `

<img src="${item.image}" width="120">

<div class="cart-info">

<h3>${item.name}</h3>

<p>Size: ${item.size}</p>

<b>₹${item.price}</b>

<br>

<button onclick="removeItem(${index})">Remove</button>

</div>

`

container.appendChild(card)

total += item.price

})

document.getElementById("cartTotal").innerText = "Total: ₹" + total


function removeItem(index){

cart.splice(index,1)

localStorage.setItem("cart",JSON.stringify(cart))

location.reload()

}


function goToPayment(){

if(cart.length === 0){

alert("Your cart is empty!")

return

}

window.location.href = "payment.html"

}

</script>

</body>
</html>

<!DOCTYPE html>
<html>

<head>
<title>Checkout</title>
<link rel="stylesheet" href="css/style.css">

<style>

.checkout-grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:40px;
margin-top:30px;
}

.form-box{
background:#020617;
border:1px solid #334155;
padding:30px;
border-radius:12px;
}

.form-box input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #334155;
background:#0f172a;
color:white;
}

.order-summary{
background:#020617;
border:1px solid #334155;
padding:25px;
border-radius:12px;
}

.payment-options label{
display:block;
margin:10px 0;
cursor:pointer;
}

.payment-box{
margin-top:15px;
display:none;
}

.payment-box input{
margin-top:8px;
}

.place-btn{
margin-top:20px;
background:#f97316;
border:none;
padding:14px;
width:100%;
border-radius:8px;
color:white;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<div id="navbar"></div>

<div class="container">

<h1>Checkout</h1>

<div class="checkout-grid">

<!-- ADDRESS -->

<div class="form-box">

<h3>Delivery Address</h3>

<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone Number">
<input id="address" placeholder="Street Address">
<input id="city" placeholder="City">
<input id="pincode" placeholder="Pincode">

<h3 style="margin-top:20px">Payment Method</h3>

<div class="payment-options">

<label>
<input type="radio" name="payment" value="cod">
Cash On Delivery
</label>

<label>
<input type="radio" name="payment" value="upi">
UPI
</label>

<label>
<input type="radio" name="payment" value="card">
Credit / Debit Card
</label>

</div>

<!-- UPI BOX -->

<div id="upiBox" class="payment-box">
<input placeholder="Enter UPI ID (example@upi)">
</div>

<!-- CARD BOX -->

<div id="cardBox" class="payment-box">

<input placeholder="Card Number">
<input placeholder="Card Holder Name">
<input placeholder="Expiry Date">
<input placeholder="CVV">

</div>

</div>

<!-- ORDER SUMMARY -->

<div class="order-summary">

<h3>Order Summary</h3>

<div id="checkoutItems"></div>

<h2 id="checkoutTotal"></h2>

<button class="place-btn" onclick="placeOrder()">
Place Order
</button>

</div>

</div>

</div>

<script src="js/main.js"></script>
<script src="js/checkout.js"></script>

</body>
</html>

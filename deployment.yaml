apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-site

spec:
  replicas: 2
  selector:
    matchLabels:
      app: static-site

  template:
    metadata:
      labels:
        app: static-site

    spec:
      containers:
      - name: static-site
        image: kgobika/pizza-website:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: static-site-service

spec:
  type: NodePort
  selector:
    app: static-site

  ports:
  - port: 80
    targetPort: 80
    nodePort: 30007   # ✅ FIXED (see below)